name: Build Boot Artifacts

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build:
    runs-on: ubuntu-24.04-arm

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Install QEMU
        run: sudo apt-get install -y qemu-system-arm qemu-efi-aarch64

      - name: Build Docker image
        run: docker build -t z-os-dev:ci .

      - name: Build kernel and run tests in QEMU
        run: ./run_tests.sh

      - name: Upload kernel artifact
        uses: actions/upload-artifact@v4
        with:
          name: kernel-elf
          path: esp/kernel.elf
          if-no-files-found: error

      - name: Upload bootloader artifact
        uses: actions/upload-artifact@v4
        with:
          name: bootloader-efi
          path: esp/EFI/BOOT/BOOTAA64.EFI
          if-no-files-found: error
